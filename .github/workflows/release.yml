name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install build tools
        run: |
          uv tool install hatch==1.17.1
          uv tool install twine==6.2.0

      - name: Validate release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          package_version=$(hatch version)
          test "$RELEASE_TAG" = "v${package_version}" || {
            echo "Release tag must match the package version."
            exit 1
          }
          tag_commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse refs/remotes/origin/main)
          test "$tag_commit" = "$head_commit" || {
            echo "Release tag must resolve to the checked-out commit."
            exit 1
          }
          test "$tag_commit" = "$main_commit" || {
            echo "Release tag must resolve to the default branch tip."
            exit 1
          }

      - name: Lint
        run: hatch run fmt-check

      - name: Test
        run: hatch run test:all

      - name: Build package
        run: hatch build

      - name: Check package metadata
        run: twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/xquik-haystack/
    permissions:
      contents: read
      id-token: write # Exchange the release identity for a short-lived PyPI token.

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          attestations: true
          packages-dir: dist/
