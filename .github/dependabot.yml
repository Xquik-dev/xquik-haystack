version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
