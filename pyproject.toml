[build-system]
requires = ["hatchling==1.32.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "xquik-haystack"
dynamic = ["version"]
description = "Haystack RAG components for Twitter search and public user timelines. Not affiliated with X Corp."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
    "haystack",
    "xquik",
    "twitter",
    "twitter-search",
    "twitter-api-alternative",
    "rag",
    "user-timeline",
]
authors = [
    { name = "Xquik", email = "support@xquik.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["haystack-ai==3.0.0"]

[project.urls]
Documentation = "https://docs.xquik.com/guides/haystack"
Issues = "https://github.com/Xquik-dev/xquik-haystack/issues"
Source = "https://github.com/Xquik-dev/xquik-haystack"

[tool.hatch.version]
source = "vcs"
tag-pattern = "v(?P<version>.*)"

[tool.hatch.version.raw-options]
git_describe_command = 'git describe --tags --match="v[0-9]*"'

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.clusterfuzzlite",
    "/.github",
]

[tool.hatch.envs.default]
installer = "uv"
dependencies = ["ruff==0.16.3"]

[tool.hatch.envs.default.scripts]
fmt = "ruff check --fix {args:.} && ruff format {args:.}"
fmt-check = "ruff check {args:.} && ruff format --check {args:.}"

[tool.hatch.envs.test]
dependencies = ["pip-audit==2.10.1", "pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0"]

[tool.hatch.envs.test.scripts]
unit = 'pytest -m "not integration" {args:tests}'
integration = 'pytest -m "integration" {args:tests}'
all = "pytest {args:tests}"
cov = "pytest --cov=haystack_integrations {args:tests}"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "C",
  "D102",   # Missing docstring in public method
  "D103",   # Missing docstring in public function
  "D205",   # 1 blank line required between summary line and description
  "D209",   # Closing triple quotes go to new line
  "D213",   # summary lines must be positioned on the second physical line of the docstring
  "D417",   # Missing argument descriptions in the docstring
  "D419",   # Docstring is empty
  "DTZ",
  "E",
  "EM",
  "F",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
    "ANN401",   # integrations accept provider JSON payloads
    "B008",     # Haystack examples commonly use Secret defaults
    "B027",    # empty method in abstract base class
    "S105",    # possible hardcoded password
    "S106",    # possible hardcoded password
    "S107",    # possible hardcoded password
    "C901",    # too complex
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
]

[tool.ruff.lint.isort]
known-first-party = ["haystack_integrations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Released component signatures accept positional arguments for compatibility.
"src/haystack_integrations/components/websearch/xquik/xquik_websearch.py" = ["PLR0917"]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["D", "PLR2004", "S101", "TID252", "ANN"]
# Examples can print their output and don't need type annotations
"examples/**/*" = ["D", "T201", "ANN"]

[tool.mypy]
install_types = true
non_interactive = true
check_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["haystack.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["haystack_integrations"]
branch = true
parallel = false

[tool.coverage.report]
omit = ["*/tests/*", "*/__init__.py"]
show_missing = true
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
minversion = "6.0"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
addopts = ["--import-mode=importlib"]
